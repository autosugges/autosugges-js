<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoSugges + HTML</title>
  </head>
  <body style="font-family: system-ui; max-width: 420px; margin: 4rem auto">
    <!-- Get a free key at https://app.autosugges.com and replace YOUR_PUBLISHABLE_KEY -->
    <script src="https://cdn.jsdelivr.net/npm/@autosugges/client/dist/browser/autosugges.js"></script>
    <input
      data-autosugges-key="YOUR_PUBLISHABLE_KEY"
      data-autosugges-base-url="https://runtime.autosugges.com"
      data-autosugges-label="Country"
      data-autosugges-placeholder="Country"
    />
  </body>
</html>
